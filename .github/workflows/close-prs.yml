name: Close outside pull requests

# Contributions are not accepted. Any pull request opened by someone other than the
# repository owner is commented on and closed automatically. This is a backup to the
# repository's interaction limits (which cap at six months).

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            if (pr.user.login.toLowerCase() === owner.toLowerCase()) {
              return; // allow the maintainer's own PRs
            }
            await github.rest.issues.createComment({
              owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: "Thanks for your interest! This project is **not accepting contributions** right now, so this pull request is being closed automatically. You're welcome to fork it for your own use under the MIT license."
            });
            await github.rest.pulls.update({
              owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed"
            });
